name: Device Health Monitor CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake ..

      - name: Build
        run: |
          cmake --build build

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Run health check
        run: |
          chmod +x scripts/health_check.sh
          ./scripts/health_check.sh

      - name: Build Docker image
        run: |
          docker build -t device-health-monitor .

      - name: Run Docker container
        run: |
          docker run --rm device-health-monitor

      - name: Test Docker healthy scenario
        run: |
          output=$(docker run --rm \
            -e DEVICE_TEMPERATURE=65 \
            -e DEVICE_MEMORY=45 \
            -e DEVICE_CPU=30 \
            -e DEVICE_DISK=55 \
            device-health-monitor)

          echo "$output"

          echo "$output" | grep -q "Overall Status: HEALTHY"

      - name: Test Docker warning scenario
        run: |
          output=$(docker run --rm \
            -e DEVICE_TEMPERATURE=75 \
            -e DEVICE_MEMORY=82 \
            -e DEVICE_CPU=70 \
            -e DEVICE_DISK=60 \
            device-health-monitor)

          echo "$output"

          echo "$output" | grep -q "Overall Status: WARNING"

      - name: Test Docker critical scenario
        run: |
          output=$(docker run --rm \
            -e DEVICE_TEMPERATURE=95 \
            -e DEVICE_MEMORY=92 \
            -e DEVICE_CPU=95 \
            -e DEVICE_DISK=90 \
            device-health-monitor)

          echo "$output"

          echo "$output" | grep -q "Overall Status: CRITICAL"
